<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07141d">
<title>Relic Runner: Sunken Frontier</title>
<style>
:root{color-scheme:dark;--cyan:#54f1e7;--gold:#ffc66d;--ink:#07141d;--panel:rgba(8,24,34,.88)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07141d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8f4ef;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:absolute;inset:0;pointer-events:none;padding:clamp(12px,2.1vw,26px);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:11px}.sigil{width:39px;height:39px;border:1px solid #6ff7e477;border-radius:12px;display:grid;place-items:center;color:var(--cyan);font-size:21px;box-shadow:0 0 24px #31e7d52b;background:#08222a}.title{font-weight:900;letter-spacing:.14em;font-size:13px}.subtitle{font-size:10px;color:#8da8a7;letter-spacing:.17em;margin-top:3px}.panel{background:linear-gradient(135deg,rgba(8,27,37,.9),rgba(8,22,32,.74));border:1px solid #a9e3db30;backdrop-filter:blur(12px);box-shadow:0 10px 35px #0005;border-radius:14px}.status{width:min(270px,40vw);padding:12px 14px}.statrow{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.12em;color:#a9bfbd}.statrow strong{color:#eafaf2;font-size:11px}.bar{height:6px;border-radius:8px;background:#243a40;margin:6px 0 10px;overflow:hidden}.fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#2fcab7,#8bffe4);transition:width .2s}.fill.hp{background:linear-gradient(90deg,#ec695e,#ffb66d)}.lower{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.quest{padding:12px 15px;width:min(315px,58vw)}.eyebrow{font-size:9px;color:var(--gold);letter-spacing:.18em;font-weight:800}.quest h3{margin:6px 0 4px;font-size:13px}.quest p{font-size:11px;line-height:1.45;color:#a9bfbd;margin:0}.objective{color:var(--cyan)!important}.actions{display:flex;gap:8px;pointer-events:auto}.action{border:1px solid #9deee54a;background:#09212acc;color:#d9f6f1;border-radius:11px;padding:10px 12px;font-size:10px;font-weight:800;letter-spacing:.1em;cursor:pointer;pointer-events:auto;backdrop-filter:blur(8px)}.action:hover,.action:active{border-color:var(--cyan);color:var(--cyan);background:#123a3a}.toast{position:absolute;left:50%;top:19%;transform:translate(-50%,-12px);padding:10px 16px;color:#defff6;font-size:12px;font-weight:700;letter-spacing:.04em;opacity:0;transition:.3s;background:#092831e8;border:1px solid #59e8d766;border-radius:999px;white-space:nowrap;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:#020a10a8;backdrop-filter:blur(6px);pointer-events:auto}#modal.open{display:flex}.card{width:min(540px,94vw);max-height:85dvh;overflow:auto;padding:22px;background:linear-gradient(145deg,#102c37,#091923);border:1px solid #5ce4d56b;border-radius:18px;box-shadow:0 25px 90px #0009}.cardhead{display:flex;justify-content:space-between;align-items:flex-start}.card h2{margin:4px 0 8px;font-size:21px;letter-spacing:.02em}.card p{color:#9db7b7;line-height:1.55;font-size:12px}.close{font-size:20px;cursor:pointer;color:#9bb8b6;padding:0 4px}.recipe{border:1px solid #a7d9d329;border-radius:12px;padding:13px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.recipe strong{font-size:13px}.recipe small{display:block;color:#9db7b7;font-size:10px;margin-top:4px}.recipe button,.primary{border:0;border-radius:9px;background:linear-gradient(135deg,#57e6d5,#7dffd0);color:#082129;font-weight:900;padding:10px 12px;cursor:pointer;white-space:nowrap}.recipe button:disabled{background:#32474a;color:#7f9695;cursor:default}.hint{font-size:10px!important;color:#6f9293!important;margin-top:14px}.mobile-controls{display:none;pointer-events:none;position:absolute;inset:0}.stick{position:absolute;left:23px;bottom:25px;width:116px;height:116px;border-radius:50%;border:1px solid #bbf5eb55;background:#0b283a77;pointer-events:auto;touch-action:none}.nub{position:absolute;width:43px;height:43px;border-radius:50%;left:36px;top:36px;background:#9df5e766;border:1px solid #d5fff080}.buttons{position:absolute;right:18px;bottom:25px;display:grid;grid-template-columns:58px 58px;grid-template-rows:58px 58px;gap:9px;pointer-events:auto}.touchbtn{border-radius:50%;border:1px solid #aaf8eb77;background:#0d3440cc;color:#dffff5;font-weight:900;font-size:11px;touch-action:none;box-shadow:0 4px 18px #0006}.touchbtn.fire{background:#275957d9;border-color:#76ffe1}.touchbtn:active{transform:scale(.94);background:#317b70}.legend{position:absolute;right:26px;bottom:72px;color:#b1c9c4a8;text-align:right;font-size:9px;letter-spacing:.08em;line-height:1.7;pointer-events:none}.kbd{color:#e7f2e7;border:1px solid #c8dcd655;border-radius:4px;padding:1px 4px}@media(max-width:650px){.subtitle{display:none}.sigil{width:34px;height:34px}.status{padding:9px 10px;width:min(205px,53vw)}.quest{width:min(245px,60vw);padding:10px}.quest h3{font-size:11px}.quest p{font-size:10px}.actions{gap:5px}.action{padding:9px;font-size:9px}.legend{display:none}.mobile-controls{display:block}.lower{padding-bottom:144px}.top{align-items:flex-start}.action .long{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top">
  <div class="brand"><div class="sigil">✦</div><div><div class="title">RELIC RUNNER</div><div class="subtitle">SUNKEN FRONTIER · FIELD LOG 01</div></div></div>
  <div class="panel status"><div class="statrow"><span>VITALITY</span><strong id="hpText">100 / 100</strong></div><div class="bar"><div class="fill hp" id="hpBar" style="width:100%"></div></div><div class="statrow"><span>SCRAP <strong id="scrap">0</strong></span><span>CORE <strong id="cores">0</strong></span></div></div>
 </div>
 <div class="lower">
  <div class="panel quest"><div class="eyebrow">ACTIVE CONTRACT · 01</div><h3 id="questTitle">Clear the relay site</h3><p class="objective" id="objective">Survey the coast &nbsp;·&nbsp; 0 / 3 sentries</p></div>
  <div class="actions"><button class="action" id="craftBtn">⚒ <span class="long"> CRAFT</span></button><button class="action" id="mapBtn">⌖ <span class="long"> MAP</span></button></div>
 </div>
</div>
<div class="legend"><span class="kbd">WASD</span> MOVE &nbsp; <span class="kbd">SPACE</span> FIRE &nbsp; <span class="kbd">SHIFT</span> DASH<br>Find the beacon · gather scrap · craft upgrades</div>
<div class="mobile-controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="buttons"><button class="touchbtn" id="dashTouch">DASH</button><button class="touchbtn fire" id="fireTouch">FIRE</button><button class="touchbtn" id="interactTouch">USE</button><button class="touchbtn" id="craftTouch">GEAR</button></div></div>
<div id="toast" class="toast"></div><div id="modal"><div class="card" id="card"></div></div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const player={x:0,y:0,z:0,hp:100,maxHp:100,speed:225,dir:{x:1,y:0},dash:0,inv:0,fire:0};
let scrap=0,cores=0,kills=0,gameTime=0,won=false;const keys={},shots=[],particles=[],drops=[];let toastTimer;
const enemies=[];const spots=[{x:0,y:0},{x:0,y:0},{x:0,y:0}];
// Hand-placed encounters around the open coastal basin.
const rand=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<8;i++){const a=i/8*Math.PI*2;enemies.push({x:Math.cos(a)*rand(370,570),y:Math.sin(a)*rand(280,430),hp:i<3?2:1,max:i<3?2:1,r:18,speed:rand(38,60),phase:rand(0,6),alive:true,elite:i<3})}
const worldItems=[];
for(let i=0;i<44;i++){let x=rand(-1000,1000),y=rand(-760,760);if(Math.hypot(x,y)<150)continue;worldItems.push({x,y,type:i%5===0?'crystal':i%3===0?'palm':'rock',scale:rand(.65,1.35),seed:rand(0,10)})}
function project(x,y,z=0){const dx=x-player.x,dy=y-player.y;return {x:W*.5+(dx-dy)*.72,y:H*.52+(dx+dy)*.34-z}}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function openModal(html){document.querySelector('#card').innerHTML=html;document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
function updateHud(){document.querySelector('#hpText').textContent=`${Math.max(0,Math.ceil(player.hp))} / ${player.maxHp}`;document.querySelector('#hpBar').style.width=`${Math.max(0,player.hp/player.maxHp*100)}%`;document.querySelector('#scrap').textContent=scrap;document.querySelector('#cores').textContent=cores;document.querySelector('#objective').textContent=won?'Frontier secured · return to the beacon':`Survey the coast  ·  ${kills} / 3 sentries`}
function craft(){openModal(`<div class="cardhead"><div><div class="eyebrow">FIELD WORKBENCH</div><h2>Make it yours.</h2></div><div class="close" onclick="window.closePanel()">×</div></div><p>Salvaged components can be assembled in the field. Your loadout persists through the expedition.</p><div class="recipe"><div><strong>Pulse Capacitor</strong><small>+25% blaster damage · cost 5 scrap, 1 core</small></div><button ${scrap<5||cores<1?'disabled':''} onclick="window.build('pulse')">${player.damage?'OWNED':'CRAFT'}</button></div><div class="recipe"><div><strong>Reinforced Shell</strong><small>+35 max vitality · cost 6 scrap</small></div><button ${scrap<6||player.maxHp>100?'disabled':''} onclick="window.build('shell')">${player.maxHp>100?'OWNED':'CRAFT'}</button></div><div class="recipe"><div><strong>Overdrive Boots</strong><small>+20% movement speed · cost 4 scrap</small></div><button ${scrap<4||player.speed>225?'disabled':''} onclick="window.build('boots')">${player.speed>225?'OWNED':'CRAFT'}</button></div><p class="hint">Recover scrap from destroyed sentries and glowing salvage nodes.</p>`)}
window.closePanel=closeModal;window.build=(type)=>{if(type==='pulse'&&scrap>=5&&cores>=1&&!player.damage){scrap-=5;cores--;player.damage=true;toast('Pulse capacitor installed · damage upgraded')}else if(type==='shell'&&scrap>=6&&player.maxHp===100){scrap-=6;player.maxHp+=35;player.hp+=35;toast('Reinforced shell installed · vitality increased')}else if(type==='boots'&&scrap>=4&&player.speed===225){scrap-=4;player.speed*=1.2;toast('Overdrive boots installed · speed increased')}updateHud();craft()};
function showMap(){openModal(`<div class="cardhead"><div><div class="eyebrow">EXPEDITION OVERVIEW</div><h2>The Sunken Frontier</h2></div><div class="close" onclick="window.closePanel()">×</div></div><p>A scattered archipelago reclaimed by the sea. The relay beacon is somewhere inland; clear the sentries to bring it back online.</p><div class="recipe"><div><strong>Contract 01 · Relay Site</strong><small>Defeat three sentries and secure the coast.</small></div><strong style="color:var(--cyan)">${Math.min(kills,3)} / 3</strong></div><p class="hint">Movement: WASD / arrow keys or left stick. Aim by moving; hold Space / FIRE to shoot. Shift / DASH to evade. Collect luminous salvage and use CRAFT to upgrade.</p>`)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function shoot(){if(player.fire>0)return;player.fire=.19;let target=null,md=610;for(const e of enemies)if(e.alive){const d=distance(player,e);if(d<md){md=d;target=e}}let dx=target?target.x-player.x:player.dir.x,dy=target?target.y-player.y:player.dir.y;const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;shots.push({x:player.x+dx*18,y:player.y+dy*18,vx:dx*560,vy:dy*560,life:.95,damage:player.damage?2:1});for(let i=0;i<3;i++)particles.push({x:player.x+dx*14,y:player.y+dy*14,vx:rand(-45,45),vy:rand(-45,45),life:.2,color:'#8bfff0',r:rand(2,4)})}
function damage(e){e.hp--;for(let i=0;i<9;i++)particles.push({x:e.x,y:e.y,vx:rand(-90,90),vy:rand(-90,90),life:rand(.2,.6),color:e.elite?'#ffba68':'#ff7765',r:rand(2,5)});if(e.hp<=0){e.alive=false;kills++;scrap+=e.elite?3:2;if(e.elite)cores++;for(let i=0;i<4;i++)drops.push({x:e.x+rand(-18,18),y:e.y+rand(-18,18),n:1,life:18});toast(e.elite?'Sentry down · core recovered':'Sentry down · salvage recovered');if(kills>=3&&!won){won=true;toast('Relay site secured · contract complete!')}}updateHud()}
function drawGround(){// layered island floor and sea fog
ctx.fillStyle='#0a2630';ctx.fillRect(0,0,W,H);
const c=project(0,0);ctx.save();ctx.translate(c.x,c.y);ctx.scale(.72,.34);
const t=performance.now()*.00008;for(let i=0;i<70;i++){let x=((i*173+Math.sin(i*12+t)*38)%2100)-1050,y=((i*317+Math.cos(i*8+t)*45)%1650)-825;ctx.beginPath();ctx.ellipse(x,y,randSeed(i,40,130),randSeed(i+8,20,45),0,0,Math.PI*2);ctx.fillStyle=i%3===0?'#163c3b':i%3===1?'#193a39':'#1c3738';ctx.fill()}
// sandy paths through central terrain
ctx.beginPath();ctx.moveTo(-1800,80);ctx.bezierCurveTo(-950,-80,-500,320,100,10);ctx.bezierCurveTo(600,-160,1180,200,1800,-80);ctx.lineWidth=205;ctx.strokeStyle='#465044';ctx.stroke();ctx.beginPath();ctx.moveTo(-1800,80);ctx.bezierCurveTo(-950,-80,-500,320,100,10);ctx.bezierCurveTo(600,-160,1180,200,1800,-80);ctx.lineWidth=183;ctx.strokeStyle='#68604a';ctx.stroke();
// decorative coastline edge polygon ellipse
ctx.beginPath();ctx.ellipse(0,0,1450,1080,0,0,Math.PI*2);ctx.lineWidth=9;ctx.strokeStyle='#5eab9b38';ctx.stroke();ctx.restore();
// distant stars / glow motes
for(let i=0;i<45;i++){let x=(i*139+gameTime*3)%W,y=(i*79+Math.sin(gameTime*.5+i)*8)%H;ctx.fillStyle=`rgba(135,238,218,${.08+.08*Math.sin(gameTime+i)})`;ctx.fillRect(x,y,2,2)} }
function randSeed(i,a,b){const n=Math.sin(i*127.1+311.7)*43758.5453;return a+(n-Math.floor(n))*(b-a)}
function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>{const s=project(p[0],p[1],p[2]||0);i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawPalm(o){const p=project(o.x,o.y);ctx.save();ctx.translate(p.x,p.y);ctx.scale(o.scale,o.scale);ctx.fillStyle='#06131888';ctx.beginPath();ctx.ellipse(0,5,21,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#795b3c';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,4);ctx.quadraticCurveTo(-3,-14,2,-33);ctx.stroke();for(let j=0;j<6;j++){ctx.save();ctx.rotate(j*Math.PI/3);ctx.fillStyle=j%2?'#347b5f':'#52a16b';ctx.beginPath();ctx.ellipse(12,-34,19,5,.25,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.restore()}
function drawRock(o){const p=project(o.x,o.y);const s=o.scale;ctx.fillStyle='#07181bb8';ctx.beginPath();ctx.ellipse(p.x,p.y+5,23*s,9*s,0,0,Math.PI*2);ctx.fill();poly([[o.x-22*s,o.y,0],[o.x-16*s,o.y,17*s],[o.x-4*s,o.y,27*s],[o.x+14*s,o.y,23*s],[o.x+22*s,o.y,8*s]],'#53635c','#718077')}
function drawCrystal(o){const p=project(o.x,o.y);let h=24*o.scale+Math.sin(gameTime*2+o.seed)*3;ctx.shadowColor='#65ffe5';ctx.shadowBlur=15;poly([[o.x-7,o.y,0],[o.x-6,o.y,h*.65],[o.x,o.y,h],[o.x+7,o.y,h*.7],[o.x+8,o.y,0]],'#56dacb','#b0fff0');ctx.shadowBlur=0;ctx.fillStyle='#b9ffef';ctx.beginPath();ctx.arc(p.x,p.y-h*.55,2,0,7);ctx.fill()}
function drawPlayer(){const p=project(player.x,player.y);const blink=player.inv>0&&Math.floor(gameTime*18)%2;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#020c12aa';ctx.beginPath();ctx.ellipse(0,2,18,8,0,0,Math.PI*2);ctx.fill();if(blink){ctx.globalAlpha=.45}
// stylized explorer body
ctx.fillStyle='#123e5a';ctx.beginPath();ctx.ellipse(0,-15,13,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1f83a0';ctx.beginPath();ctx.ellipse(0,-18,11,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b7f4df';ctx.beginPath();ctx.ellipse(4,-22,5,4,-.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffc66d';ctx.beginPath();ctx.arc(0,-32,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#153e50';ctx.beginPath();ctx.arc(0,-33,7,Math.PI,Math.PI*2);ctx.fill();const dx=player.dir.x,dy=player.dir.y;ctx.strokeStyle='#95eee0';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(dx*5,-17);ctx.lineTo(dx*18,-19+dy*3);ctx.stroke();ctx.restore()}
function drawEnemy(e){const p=project(e.x,e.y);ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#02090bb5';ctx.beginPath();ctx.ellipse(0,3,18,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.elite?'#964b40':'#7b5541';ctx.beginPath();ctx.ellipse(0,-12,14,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.elite?'#ff9970':'#e6b56c';ctx.beginPath();ctx.arc(-5,-17,4,0,7);ctx.arc(5,-17,4,0,7);ctx.fill();ctx.fillStyle='#241e22';ctx.beginPath();ctx.arc(-5,-17,1.5,0,7);ctx.arc(5,-17,1.5,0,7);ctx.fill();if(e.elite){ctx.fillStyle='#ffd38a';ctx.fillRect(-18,-35,36,3);ctx.fillStyle='#f37660';ctx.fillRect(-18,-35,36*e.hp/e.max,3)}ctx.restore()}
function draw(){drawGround();const things=[];for(const o of worldItems){if(Math.abs(o.x-player.x)>1150||Math.abs(o.y-player.y)>1150)continue;things.push({d:o.x+o.y,fn:()=>o.type==='palm'?drawPalm(o):o.type==='crystal'?drawCrystal(o):drawRock(o)})}for(const e of enemies)if(e.alive)things.push({d:e.x+e.y,fn:()=>drawEnemy(e)});for(const d of drops)things.push({d:d.x+d.y,fn:()=>{const p=project(d.x,d.y,5+Math.sin(gameTime*5+d.x)*3);ctx.fillStyle='#7dffe3';ctx.shadowColor='#5fffe3';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill();ctx.shadowBlur=0}});things.push({d:player.x+player.y,fn:drawPlayer});things.sort((a,b)=>a.d-b.d);things.forEach(t=>t.fn());
for(const s of shots){const p=project(s.x,s.y,7);ctx.shadowColor='#8effed';ctx.shadowBlur=13;ctx.fillStyle='#c7fff2';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const q of particles){const p=project(q.x,q.y,randSeed(Math.floor(q.life*100),0,10));ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(p.x,p.y,q.r,0,7);ctx.fill();ctx.globalAlpha=1}
// nearby salvage / beacon interaction hints
let nearest=Infinity;for(const o of worldItems)if(o.type==='crystal'){const d=distance(player,o);if(d<nearest)nearest=d}if(nearest<50){const p=project(player.x,player.y-28);ctx.fillStyle='#e2fff7';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('TAP USE TO SALVAGE',p.x,p.y-50)}if(Math.hypot(player.x,player.y)<95&&!won){const p=project(0,0);ctx.fillStyle='#d5fff3';ctx.textAlign='center';ctx.font='bold 10px system-ui';ctx.fillText('RELAY BEACON',p.x,p.y-52);ctx.strokeStyle='#5fffe044';ctx.beginPath();ctx.arc(p.x,p.y-28,22+Math.sin(gameTime*3)*3,0,Math.PI*2);ctx.stroke()}
}
function update(dt){gameTime+=dt;player.fire=Math.max(0,player.fire-dt);player.inv=Math.max(0,player.inv-dt);player.dash=Math.max(0,player.dash-dt);let mx=0,my=0;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;mx+=stick.x;my+=stick.y;const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}if(ml>.1){player.dir={x:mx,y:my}}const speed=player.speed*(player.dash>0?3.2:1);player.x+=mx*speed*dt;player.y+=my*speed*dt;player.x=Math.max(-1120,Math.min(1120,player.x));player.y=Math.max(-850,Math.min(850,player.y));
if((keys.Space||fireHeld)&&!document.querySelector('#modal').classList.contains('open'))shoot();if(keys.ShiftLeft||keys.ShiftRight){if(player.dash<=0){player.dash=.22;player.inv=.43;player.x+=player.dir.x*70;player.y+=player.dir.y*70}}
for(const e of enemies)if(e.alive){e.phase+=dt;const d=distance(e,player);if(d<450&&d>36){e.x+=(player.x-e.x)/d*e.speed*dt;e.y+=(player.y-e.y)/d*e.speed*dt}if(d<31&&player.inv<=0){player.hp-=e.elite?14:9;player.inv=.65;const dx=(player.x-e.x)/(d||1),dy=(player.y-e.y)/(d||1);player.x+=dx*26;player.y+=dy*26;toast('Hit! Keep moving.');if(player.hp<=0){player.hp=100;kills=Math.max(0,kills-1);player.x=0;player.y=0;toast('Field repair · returned to relay');updateHud()}}}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let hit=false;for(const e of enemies)if(e.alive&&distance(e,s)<22){damage(e);hit=true;break}if(hit||s.life<=0)shots.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.life-=dt;if(distance(d,player)<36){scrap+=d.n;drops.splice(i,1);updateHud()}else if(d.life<0)drops.splice(i,1)}
updateHud()}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;if(!document.querySelector('#modal').classList.contains('open'))update(dt);draw();requestAnimationFrame(loop)}let last=performance.now();requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyC')craft();if(e.code==='KeyM')showMap();if(e.code==='KeyE')interact()});addEventListener('keyup',e=>keys[e.code]=false);let fireHeld=false;document.querySelector('#craftBtn').onclick=craft;document.querySelector('#mapBtn').onclick=showMap;document.querySelector('#craftTouch').onclick=craft;document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function interact(){let target=null,md=52;for(const o of worldItems)if(o.type==='crystal'){const d=distance(player,o);if(d<md){md=d;target=o}}if(target){worldItems.splice(worldItems.indexOf(target),1);scrap+=3;toast('Luminous salvage collected · +3 scrap');updateHud();return}if(Math.hypot(player.x,player.y)<100){toast(won?'Relay online · frontier secured':'Relay is dormant · clear the sentries');return}toast('Nothing nearby to interact with')}
document.querySelector('#interactTouch').onclick=interact;document.querySelector('#dashTouch').addEventListener('pointerdown',e=>{e.preventDefault();player.dash=.22;player.inv=.43;player.x+=player.dir.x*70;player.y+=player.dir.y*70});const ft=document.querySelector('#fireTouch');ft.addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;ft.setPointerCapture(e.pointerId)});ft.addEventListener('pointerup',()=>fireHeld=false);ft.addEventListener('pointercancel',()=>fireHeld=false);
const stickEl=document.querySelector('#stick'),nub=document.querySelector('#nub'),stick={x:0,y:0};let stickId=null;function stickMove(e){const r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy),max=39,k=Math.min(1,max/(l||1));stick.x=dx*k/max;stick.y=dy*k/max;nub.style.transform=`translate(${dx*k}px,${dy*k}px)`}stickEl.addEventListener('pointerdown',e=>{stickId=e.pointerId;stickEl.setPointerCapture(e.pointerId);stickMove(e)});stickEl.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function resetStick(e){if(e.pointerId===stickId){stickId=null;stick.x=stick.y=0;nub.style.transform=''}}stickEl.addEventListener('pointerup',resetStick);stickEl.addEventListener('pointercancel',resetStick);
// First-run direction and safe area behavior.
updateHud();setTimeout(()=>toast('Explore the coast · sentries are closing in'),700);
})();
</script>
